name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: no package-lock.json
        run: |
          if [ -f package-lock.json ] || [ -f yarn.lock ]; then
            echo "pnpm only — remove package-lock.json / yarn.lock" >&2
            exit 1
          fi

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

  # Proves the cleanup guarantee that matters most: SIGKILL a run mid-injection
  # and the next process must put the target back. Needs the real lab, so it is
  # a separate job — `check` stays the fast gate.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: start lab
        run: pnpm lab:up

      - run: pnpm test:integration

      - name: lab logs on failure
        if: failure()
        run: docker compose -f apps/lab/docker-compose.yml logs --tail=100

      - name: stop lab
        if: always()
        run: pnpm lab:down
