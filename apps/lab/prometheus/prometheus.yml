# Tight intervals on purpose: detection latency is a measured output, and a
# 15s scrape would put a 15s floor under every MTTD number alarmdrill reports.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml
  # Empty by default. Where a rule alarmdrill proposed gets applied, so the
  # deliberately-incomplete alerts.yml never has to be edited to close a gap.
  - /etc/prometheus/proposed/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ['gateway:3000']
  - job_name: checkout
    static_configs:
      - targets: ['checkout:3001']
  - job_name: payments
    static_configs:
      - targets: ['payments:3002']
  - job_name: psp-mock
    static_configs:
      - targets: ['psp-mock:3003']
  - job_name: catalog
    static_configs:
      - targets: ['catalog:3004']

# Deliberately not scraped: redis and postgres have no exporters. Nobody is
# watching the datastores directly, which is why stopping Redis produces no
# `up == 0` signal anywhere. See ../README.md.
