packages:
  - 'packages/*'
  - 'apps/*'

# Everything else stays sandboxed; esbuild only needs its platform binary.
onlyBuiltDependencies:
  - esbuild

catalog:
  # runtime
  '@types/dockerode': ^4.0.1
  '@types/pg': ^8.21.0
  commander: ^15.0.0
  dockerode: ^5.0.1
  fastify: ^5.12.0
  ioredis: ^6.0.0
  pg: ^8.23.0
  pino: ^10.3.1
  pino-pretty: ^13.1.3
  prom-client: ^15.1.3
  zod: ^4.4.3

  # tooling
  '@eslint/js': ^10.0.1
  '@types/node': ^22.18.0
  eslint: ^10.8.1
  testcontainers: ^12.1.0
  tsx: ^4.23.12
  typescript: ^6.0.3
  typescript-eslint: ^8.67.0
  vitest: ^4.1.10
  yaml: ^2.9.0
